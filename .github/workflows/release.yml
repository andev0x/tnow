name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    # Only stable tags such as v0.0.1 are released.
    # Pre-release tags such as v0.0.1-beta are intentionally skipped.
    if: github.ref_type == 'tag' && github.ref_name =~ '^v[0-9]+\.[0-9]+\.[0-9]+$'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              echo "Building ${os}/${arch}..."
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
                go build -trimpath -ldflags="-s -w" -o tnow ./cmd/tnow
              tar -czf "dist/tnow_${os}_${arch}.tar.gz" tnow
              rm -f tnow
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt